<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-label="Luca Gelli. Banking strategy, building with AI agents.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1622"/>
      <stop offset="1" stop-color="#0f2530"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ee6b0"/>
      <stop offset="1" stop-color="#3aa0ff"/>
    </linearGradient>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.6" fill="#3ee6b0"/>
    </pattern>
    <mask id="fade">
      <rect x="560" y="0" width="280" height="220" fill="url(#fadeg)"/>
    </mask>
    <linearGradient id="fadeg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
    .glow { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .glow, .blink { animation: none } }
  </style>
  <rect x="1" y="1" width="838" height="218" rx="16" fill="url(#bg)"/>
  <rect class="glow" x="1" y="1" width="838" height="218" rx="16" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <rect x="560" y="0" width="280" height="220" fill="url(#dots)" mask="url(#fade)"/>

  <text x="40" y="58" class="mono" font-size="15" fill="#3ee6b0">@diarmuidfianna</text>
  <text x="40" y="108" class="sans" font-size="44" font-weight="700" fill="#ffffff">Luca Gelli</text>
  <text x="40" y="142" class="mono" font-size="16" fill="#9fb3c8">Banking strategy · building with AI agents<tspan class="blink" fill="#3ee6b0"> _</tspan></text>

  <g class="mono" font-size="13" fill="#d6e2ee">
    <g transform="translate(40,166)">
      <rect width="96" height="28" rx="14" fill="#13202c" stroke="#2b3d4f"/>
      <circle cx="16" cy="14" r="5" fill="#3572A5"/><text x="28" y="19">Python</text>
    </g>
    <g transform="translate(146,166)">
      <rect width="120" height="28" rx="14" fill="#13202c" stroke="#2b3d4f"/>
      <circle cx="16" cy="14" r="5" fill="#3178c6"/><text x="28" y="19">TypeScript</text>
    </g>
    <g transform="translate(276,166)">
      <rect width="120" height="28" rx="14" fill="#13202c" stroke="#2b3d4f"/>
      <circle cx="16" cy="14" r="5" fill="#f1e05a"/><text x="28" y="19">JavaScript</text>
    </g>
    <g transform="translate(406,166)">
      <rect width="90" height="28" rx="14" fill="#13202c" stroke="#2b3d4f"/>
      <circle cx="16" cy="14" r="5" fill="#A97BFF"/><text x="28" y="19">Kotlin</text>
    </g>
  </g>
</svg>
